<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3d6e"><link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet"><title>إدارة منطقة طنطا - النقل النهري</title>
<style>
:root{--b:#0b3d6e;--c:#1769b5;--l:#eef4fb;--t:#16212e}
*{box-sizing:border-box}body{margin:0;font-family:'Cairo',Tahoma,Arial,sans-serif;background:var(--l);color:var(--t)}
.bar{background:var(--b);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;display:flex;gap:8px;align-items:center;position:sticky;top:0;z-index:5}
.bar h1{font-size:16px;margin:0;flex:1}.gr{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}.gr .f{grid-column:span 2}.gr .h{grid-column:span 1}.gr input,.gr select{min-width:0}.w{padding:12px;max-width:760px;margin:auto}
.card{background:#fff;border-radius:12px;padding:12px;margin:8px 0;box-shadow:0 1px 4px #0002}
button,.bt{background:var(--c);color:#fff;border:0;border-radius:8px;padding:9px 12px;font:inherit;margin:3px;cursor:pointer;text-decoration:none;display:inline-block}
button.g{background:#e3ebf5;color:var(--b)}button.r{background:#c0392b}button.k{background:#25a244}
input,select,textarea{width:100%;padding:9px;border:1px solid #b9c7d8;border-radius:8px;font:inherit;margin:3px 0 8px;background:#fff}
label{font-size:13px;color:#456}.row{display:flex;gap:6px}.row>*{flex:1}
.bd{font-size:12px;padding:2px 8px;border-radius:9px;color:#fff;background:#25a244}.bd.o{background:#e08e0b}.bd.x{background:#c0392b}
.kv{display:flex;justify-content:space-between;border-bottom:1px solid #eef;padding:6px 0;gap:10px}.kv b{color:var(--b);white-space:nowrap}
.sp{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:9;animation:f 2.6s forwards}
@keyframes f{0%,80%{opacity:1}100%{opacity:0;visibility:hidden}}.sp img{width:200px;animation:z 1.6s}@keyframes z{from{transform:scale(.6);opacity:0}}
.sp h2{color:var(--b);margin:14px 0 2px}.im{width:100%;border-radius:8px;margin-top:6px}
#pr{display:none;font-family:'Cairo',Tahoma,sans-serif}table{border-collapse:collapse;width:100%}td,th{border:1px solid #333;padding:5px;font-size:12px}th{background:#dde8f4}
@media print{body>*:not(#pr){display:none!important}#pr{display:block;padding:10mm;color:#000;background:#fff}
.ph{display:flex;justify-content:space-between;align-items:center;border-bottom:3px double #000;padding-bottom:8px;text-align:center;font-weight:bold;font-size:13px}.ph img{height:80px}
#pr h2{text-align:center;text-decoration:underline}.pf{margin-top:30px;display:flex;justify-content:space-between;font-size:13px}#pr img.pi{max-width:100%;max-height:230mm;page-break-inside:avoid}}
</style></head><body><div id="app"></div><div id="pr"></div>
<script>
Array.prototype.toString=function(){return this.join('')};
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SECRET='mohamed elgamal',MGR='مهندس بحري/ محمد الجمل';
const FL=[['gov','كود المحافظة',,1],['num','رقم الوحدة',,1],['old','الرقم القديم'],['res','محل الإقامة'],['type','نوع الوحدة',,1],['mat','مادة الصنع',,1],['op','طريقة التشغيل',['آلي','غير آلي'],1],['purpose','الغرض',['نزهة خاصة','نقل ركاب','معدية سيارات','نقل بضائع','بيع أسماك','قاعة أفراح'],1],['dL','الطول (م)',,1],['dW','العرض (م)',,1],['dH','الارتفاع (م)',,1],['li','تاريخ إصدار التصريح','d',1],['le','تاريخ نهاية التصريح','d',1],['dry','تاريخ نهاية الجفاف','d',1],['dryE','اسم مهندس الجفاف',,1],['water','تاريخ نهاية المياه','d',1],['waterE','اسم مهندس المياه',,1],['load','الحمولة',,1],['pax','عدد الركاب',,1],['ni','تاريخ المعاينة المقبلة','d'],['loc','إحداثيات خرائط جوجل (lat,lng) أو رابط']];
const DF=[['li','تاريخ إصدار التصريح'],['le','تاريخ نهاية التصريح'],['dry','نهاية الجفاف'],['water','نهاية المياه'],['ni','المعاينة المقبلة']];
let DB,role,view='splash',cur=null,F={q:'',m:'all',df:'',a:'',b:''},AF={k:'',m:'all',a:'',b:''},asof='';
const idb=()=>new Promise(r=>{const q=indexedDB.open('rta',1);q.onupgradeneeded=()=>q.result.createObjectStore('s');q.onsuccess=()=>r(q.result)});
const load=async()=>{const d=await idb();return new Promise(r=>{const q=d.transaction('s').objectStore('s').get('db');q.onsuccess=()=>r(q.result)})};
const save=async()=>{const d=await idb();d.transaction('s','readwrite').objectStore('s').put(DB,'db')};
const go=(v,u)=>{view=v;if(u!==undefined)cur=u;R();scrollTo(0,0)};
const U=id=>DB.units.find(u=>u.id==id);
const bar=(t,back)=>`<div class="bar">${back?`<button class="g" onclick="go('${back}')">→</button>`:''}<h1>${t}</h1></div>`;
const days=d=>d?Math.ceil((new Date(d)-new Date(new Date().toDateString()))/864e5):null;
const bdg=d=>{const n=days(d);return n===null?'':n<0?'<span class="bd x">منتهي</span>':n<=30?`<span class="bd o">ينتهي بعد ${n} يوم</span>`:'<span class="bd">ساري</span>'};
const rd=f=>new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1100/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.72))};i.src=URL.createObjectURL(f)});
const wa=(n,t)=>{n=String(n).replace(/\D/g,'');if(n.startsWith('0'))n='2'+n;window.open('https://wa.me/'+n+'?text='+encodeURIComponent(t||''),'_blank')};
const map=u=>{const l=u.loc||'';window.open(/^http/.test(l)?l:'https://www.google.com/maps?q='+encodeURIComponent(l||u.addr||u.name),'_blank')};
function R(){const a=$('#app');a.innerHTML=({splash,login,home,unit,form,hist,arch,admin,bc})[view]();}
function splash(){setTimeout(()=>go('login'),2600);return`<div class="sp"><img src="logo.png"><h2>إدارة منطقة طنطا</h2><div>${MGR}</div></div>`}
/* ---------- login ---------- */
function login(){if(!DB.pw)return`${bar('إعداد البرنامج لأول مرة')}<div class="w"><div class="card"><label>كلمة السر</label><input id="p1" type="password"><label>الرقم الثابت (يُستخدم عند تغيير كلمة السر)</label><input id="p2"><label>رقم الموبايل الثابت (واتساب، لا يمكن تغييره)</label><input id="p3" type="tel" placeholder="01xxxxxxxxx"><button onclick="setup()">حفظ والبدء</button></div></div>`;
return`<div class="w" style="text-align:center;padding-top:40px"><img src="logo.png" width="170"><h2 style="color:var(--b);margin:8px">إدارة منطقة طنطا</h2><div>${MGR}</div><div class="card" style="margin-top:20px"><input id="pw" type="password" placeholder="كلمة السر"><button onclick="enter()">دخول مدير</button><button class="g" onclick="role='v';go('home')">دخول عرض فقط</button><br><button class="g" onclick="forgot()">نسيت كلمة السر؟ (إرسال على واتساب)</button></div></div>`}
async function setup(){const p=[p1,p2,p3].map(x=>x.value.trim());if(p.some(x=>!x))return alert('أكمل كل الحقول');DB.pw=p[0];DB.code=p[1];DB.phone=p[2];await save();role='a';go('home')}
const enter=()=>{if(pw.value===DB.pw){role='a';go('home')}else alert('كلمة السر غير صحيحة')};
const forgot=()=>{if(confirm('سيتم فتح واتساب لإرسال البيانات إلى الرقم الثابت المسجل'))wa(DB.phone,`بيانات الدخول - برنامج إدارة منطقة طنطا\nكلمة السر: ${DB.pw}\nالرقم الثابت لتغيير كلمة السر: ${DB.code}`)};
/* ---------- home / search ---------- */
function match(u){const q=F.q.trim().toLowerCase(),o=ow(u);const s=F.m=='num'?u.gov+u.num+u.old:F.m=='own'?o:[u.gov,u.num,u.old,o,u.res,(u.phones||[]).join(' ')].join(' ');
if(q&&!String(s).toLowerCase().includes(q))return 0;if(F.df){const v=u[F.df];if(!v||(F.a&&v<F.a)||(F.b&&v>F.b))return 0}return 1}
function home(){const L=DB.units.filter(match);return`${bar('وحدات منطقة طنطا ('+L.length+')')}<div class="w"><div class="card">
<div class="row"><input placeholder="بحث..." value="${E(F.q)}" oninput="F.q=this.value;lst()"><select onchange="F.m=this.value;lst()"><option value="all">الكل</option><option value="num" ${F.m=='num'?'selected':''}>رقم الوحدة</option><option value="own" ${F.m=='own'?'selected':''}>اسم المالك</option></select></div>
<div class="row"><select onchange="F.df=this.value;lst()"><option value="">تصفية بتاريخ...</option>${DF.map(d=>`<option value="${d[0]}" ${F.df==d[0]?'selected':''}>${d[1]}</option>`)}</select><input type="date" value="${F.a}" onchange="F.a=this.value;lst()"><input type="date" value="${F.b}" onchange="F.b=this.value;lst()"></div>
<button onclick="listPdf()">📄 تقرير PDF للنتائج</button><button class="g" onclick="csvOut(1)">⬇ Excel (CSV)</button>${role=='a'?`<button class="k" onclick="go('form',null)">＋ وحدة جديدة</button><button class="g" onclick="go('admin')">⚙ الإدارة</button>`:''}<button class="g" onclick="go('login')">خروج</button></div><div id="L">${cards(L)}</div></div>`}
const title=u=>'وحدة رقم '+(u.gov?u.gov+'-':'')+u.num;
const ow=u=>(u.owners||[]).map(o=>typeof o=='string'?o:o.n+(o.s?` (${o.s} قيراط)`:'')).join('، ');
const cards=L=>L.map(u=>`<div class="card" onclick="go('unit',${u.id})"><b>${E(title(u))}</b> — ${E(ow(u)||'—')}<br><small>${E(u.type)} | ${E(u.purpose)} | ${E(u.op)}</small><br>انتهاء التصريح: ${E(u.le||'—')} ${bdg(u.le)}</div>`).join('')||'<div class="card">لا توجد نتائج</div>';
const lst=()=>{$('#L').innerHTML=cards(DB.units.filter(match))};
/* ---------- unit ---------- */
const rows=u=>FL.map(f=>`<div class="kv"><b>${f[1]}</b><span>${E(u[f[0]]||'—')}</span></div>`).join('')+`<div class="kv"><b>المالك / الشركاء</b><span>${E(ow(u)||'—')}</span></div><div class="kv"><b>هاتف</b><span>${E((u.phones||[]).join('، ')||'—')}</span></div>`;
function unit(){const c=U(cur),u=(asof&&asOf(c,asof))||c;return`${bar(E(title(c)),'home')}<div class="w"><div class="card">${c.img?`<img class="im" src="${c.img}">`:''}
<div class="row"><input type="date" value="${asof}" onchange="asof=this.value;R()"><button class="g" onclick="asof='';R()">الحالي</button></div>
${asof&&!asOf(c,asof)?'<p style="color:#c0392b">لا توجد بيانات للوحدة في هذا التاريخ</p>':asof?`<p><span class="bd o">بيانات الوحدة بتاريخ ${asof}</span></p>`:''}
${rows(u)}<div class="kv"><b>حالة التصريح</b>${bdg(u.le)}</div><div class="kv"><b>حالة الجفاف</b>${bdg(u.dry)}</div><div class="kv"><b>حالة المياه</b>${bdg(u.water)}</div></div><div class="card">
<button onclick="map(U(${c.id}))">📍 الخريطة</button><button onclick="unitPdf(${c.id})">📄 تقرير PDF</button><button class="g" onclick="go('hist')">🕘 سجل التعديلات</button><button class="g" onclick="go('arch')">🗂 أرشيف الصور</button>
${(c.phones||[]).map(p=>`<button class="k" onclick="wa('${p}','')">واتساب ${E(p)}</button><a class="bt g" href="tel:${E(p)}">اتصال</a>`).join('')}
${role=='a'?`<div style="width:100%;border:1px dashed var(--c);border-radius:10px;padding:8px;margin:6px 0"><b>🔄 تجديد / إصدار ترخيص</b><div class="row"><div><label>تاريخ الإصدار/التجديد</label><input type="date" id="rn1"></div><div><label>تاريخ الانتهاء</label><input type="date" id="rn2"></div></div><button class="k" onclick="renew(${c.id})">حفظ التجديد</button></div><button onclick="go('form',${c.id})">✏ تعديل بيانات الوحدة</button><button class="r" onclick="del(${c.id})">حذف</button>`:''}</div></div>`}
function asOf(u,d){const t=new Date(d+'T23:59:59').getTime();if(t>=u.upd)return u;const h=DB.hist.filter(x=>x.uid==u.id&&x.from<=t&&t<x.until).pop();return h?{...u,...h.s}:null}
async function renew(id){if(!rn1.value||!rn2.value)return alert('أدخل تاريخ الإصدار وتاريخ الانتهاء');const u=U(id),s={...u};delete s.arch;delete s.img;DB.hist.push({uid:id,from:u.upd,until:Date.now(),why:'تجديد/إصدار ترخيص',s});u.li=rn1.value;u.le=rn2.value;u.upd=Date.now();await save();asof='';R()}
const del=async id=>{if(confirm('حذف الوحدة نهائياً؟')){DB.units=DB.units.filter(u=>u.id!=id);await save();go('home')}};
/* ---------- form ---------- */
const ownRow=o=>`<div class="row orow"><input class="on" placeholder="اسم المالك / الشريك" value="${E(o&&o.n)}"><input class="os" placeholder="الحصة بالقيراط" value="${E(o&&o.s)}" style="max-width:130px"></div>`;
const addOw=()=>$('#ow').insertAdjacentHTML('beforeend',ownRow());
function form(){const u=cur?U(cur):{owners:[],phones:[]};
const g=k=>{const f=FL.find(x=>x[0]==k);return`<div class="${f[3]?'h':'f'}"><label>${f[1]}</label>`+(Array.isArray(f[2])?`<select id="f_${k}"><option></option>${f[2].map(o=>`<option ${u[k]==o?'selected':''}>${o}</option>`)}</select>`:`<input id="f_${k}" ${f[2]=='d'?'type="date"':''} value="${E(u[k])}">`)+'</div>'};
return`${bar(cur?'تعديل الوحدة':'وحدة جديدة',cur?'unit':'home')}<div class="w"><div class="card gr">${['gov','num','old'].map(g).join('')}
<div class="f"><label>اسم المالك (شركاء - الحصة بالقيراط)</label><div id="ow">${(u.owners.length?u.owners:[{}]).map(o=>ownRow(o))}</div><button class="g" onclick="addOw()">＋ إضافة شريك</button></div>
${g('res')}<div class="f"><label>هاتف (رقم أو أكثر - كل رقم في سطر)</label><textarea id="f_phones" rows="2">${E((u.phones||[]).join('\n'))}</textarea></div>
${['type','mat','op','purpose','dL','dW','dH','li','le','dry','dryE','water','waterE','load','pax','ni','loc'].map(g).join('')}
<div class="f"><label>صورة الوحدة</label><input type="file" accept="image/*" id="f_img"></div>
<div class="f"><label>أرشيف صور التصريح (رفع) + تاريخ التصريح</label><input type="file" accept="image/*" multiple id="f_lic"><input type="date" id="f_licd" value="${u.li||''}"></div>
<div class="f"><label>أرشيف صور المعاينة (رفع) + تاريخ المعاينة</label><input type="file" accept="image/*" multiple id="f_insp"><input type="date" id="f_inspd"></div>
${cur?`<div class="f"><label>ملاحظات / سبب التعديل (إجباري عند تغيير النوع أو التشغيل أو الغرض أو الأبعاد)</label><textarea id="f_why" rows="2"></textarea></div>`:''}
<div class="f"><button onclick="saveU()">💾 حفظ</button></div></div></div>`}
async function saveU(){const n={};FL.forEach(f=>n[f[0]]=$('#f_'+f[0]).value.trim());
n.owners=[...document.querySelectorAll('.orow')].map(r=>({n:r.querySelector('.on').value.trim(),s:r.querySelector('.os').value.trim()})).filter(o=>o.n);
n.phones=$('#f_phones').value.split('\n').map(x=>x.trim()).filter(Boolean);
if(!n.num)return alert('رقم الوحدة مطلوب');const f=$('#f_img').files[0],img=f?await rd(f):null;let u;
if(!cur){if(DB.units.some(x=>x.num==n.num&&x.gov==n.gov))return alert('رقم الوحدة مستخدم');u={...n,id:Date.now(),upd:Date.now(),arch:[],img};DB.units.push(u)}
else{u=U(cur);const why=$('#f_why').value.trim();if(['type','op','purpose','dL','dW','dH'].some(k=>u[k]!=n[k]&&(u[k]||n[k]))&&!why)return alert('اكتب ملاحظات وسبب التعديل');
const sn={...u};delete sn.arch;delete sn.img;DB.hist.push({uid:u.id,from:u.upd,until:Date.now(),why,s:sn});Object.assign(u,n,{upd:Date.now()});if(img)u.img=img}
u.arch=u.arch||[];let i=0;for(const[k,a,d]of[['lic','#f_lic','#f_licd'],['insp','#f_insp','#f_inspd']])for(const x of $(a).files)u.arch.push({id:Date.now()+(i++),k,d:$(d).value||new Date().toISOString().slice(0,10),img:await rd(x)});
await save();go(cur?'unit':'home')}
/* ---------- history ---------- */
function hist(){const c=U(cur),H=DB.hist.filter(x=>x.uid==c.id).reverse();return`${bar('سجل التعديلات - '+E(title(c)),'unit')}<div class="w"><div class="card"><b>البيانات الحالية</b> (منذ ${new Date(c.upd).toLocaleString('ar-EG')})${rows(c)}</div>${H.map(x=>`<div class="card"><b>نسخة سابقة</b><br><small>من ${new Date(x.from).toLocaleString('ar-EG')} إلى ${new Date(x.until).toLocaleString('ar-EG')}</small>${x.why?`<br>سبب التعديل: ${E(x.why)}`:''}${rows(x.s)}</div>`).join('')||'<div class="card">لا توجد تعديلات سابقة</div>'}</div>`}
/* ---------- archive ---------- */
function arch(){const c=U(cur);let L=(c.arch||[]).slice().sort((a,b)=>b.d.localeCompare(a.d));if(AF.k)L=L.filter(x=>x.k==AF.k);
if(AF.m=='last')L=L.slice(0,1);else if(AF.m=='rng')L=L.filter(x=>(!AF.a||x.d>=AF.a)&&(!AF.b||x.d<=AF.b));window._A=L;
return`${bar('أرشيف '+E(title(c)),'unit')}<div class="w">${role=='a'?`<div class="card"><b>إضافة للأرشيف</b><div class="row"><select id="ak"><option value="lic">ترخيص/تصريح</option><option value="insp">معاينة/تقرير</option></select><input type="date" id="ad"></div><input type="file" accept="image/*" id="af"><button onclick="addA()">إضافة</button></div>`:''}
<div class="card"><div class="row"><select onchange="AF.k=this.value;R()"><option value="">الكل</option><option value="lic" ${AF.k=='lic'?'selected':''}>تراخيص</option><option value="insp" ${AF.k=='insp'?'selected':''}>معاينات</option></select><select onchange="AF.m=this.value;R()"><option value="all">كل التواريخ</option><option value="last" ${AF.m=='last'?'selected':''}>آخر تصريح / آخر معاينة</option><option value="rng" ${AF.m=='rng'?'selected':''}>مدى زمني</option></select></div>
${AF.m=='rng'?`<div class="row"><input type="date" value="${AF.a}" onchange="AF.a=this.value;R()"><input type="date" value="${AF.b}" onchange="AF.b=this.value;R()"></div>`:''}<button onclick="archPdf()">📄 طباعة / PDF للصور</button></div>
${L.map((x,i)=>`<div class="card"><b>${x.k=='lic'?'ترخيص':'معاينة'}</b> — ${x.d}<img class="im" src="${x.img}">${role=='a'?`<button class="r" onclick="delA('${x.id}')">حذف</button>`:''}</div>`).join('')||'<div class="card">لا توجد صور</div>'}</div>`}
async function addA(){if(!ad.value||!af.files[0])return alert('اختر التاريخ والصورة');const c=U(cur);c.arch=c.arch||[];c.arch.push({id:Date.now(),k:ak.value,d:ad.value,img:await rd(af.files[0])});await save();R()}
const delA=async id=>{const c=U(cur);c.arch=c.arch.filter(x=>x.id!=id);await save();R()};
/* ---------- print / PDF ---------- */
function pr(t,b){$('#pr').innerHTML=`<div class="ph"><div>وزارة النقل والمواصلات<br>الهيئة العامة للنقل النهري<br>منطقة طنطا</div><img src="logo.png"><div>مدير المنطقة<br>${MGR}</div></div><h2>${t}</h2>${b}<div class="pf"><span>تاريخ الإصدار: ${new Date().toLocaleDateString('ar-EG')}</span><span>التوقيع: ................</span></div>`;setTimeout(()=>print(),300)}
const unitPdf=id=>{const u=U(id);pr('بيان بيانات وحدة نهرية',`<table>${FL.map(f=>`<tr><th width="35%">${f[1]}</th><td>${E(u[f[0]]||'—')}</td></tr>`).join('')}<tr><th>المالك / الشركاء</th><td>${E(ow(u))}</td></tr><tr><th>هاتف</th><td>${E((u.phones||[]).join('، '))}</td></tr></table>`)};
const listPdf=()=>pr('كشف الوحدات',`<table><tr><th>م</th><th>رقم الوحدة</th><th>المالك</th><th>نوع الوحدة</th><th>الغرض</th><th>التشغيل</th><th>نهاية التصريح</th><th>نهاية الجفاف</th><th>نهاية المياه</th></tr>${DB.units.filter(match).map((u,i)=>`<tr><td>${i+1}</td><td>${E(title(u))}</td><td>${E(ow(u))}</td><td>${E(u.type)}</td><td>${E(u.purpose)}</td><td>${E(u.op)}</td><td>${E(u.le)}</td><td>${E(u.dry)}</td><td>${E(u.water)}</td></tr>`).join('')}</table>`);
const archPdf=()=>pr('صور أرشيف الوحدة: '+E(title(U(cur))),(window._A||[]).map(x=>`<p><b>${x.k=='lic'?'ترخيص':'معاينة'} - ${x.d}</b><br><img class="pi" src="${x.img}"></p>`).join(''));
/* ---------- admin ---------- */
function admin(){return`${bar('لوحة المدير','home')}<div class="w"><div class="card"><b>نسخة احتياطية</b><br><button onclick="bk()">⬇ حفظ نسخة كاملة</button><label>استرجاع نسخة (JSON)</label><input type="file" accept=".json" onchange="rs(this.files[0])"></div>
<div class="card"><b>Excel</b><br><button onclick="xlsOut()">⬇ تصدير Excel (.xls)</button> <button onclick="csvOut()">⬇ تصدير CSV</button><label>استيراد ملف CSV (يدعم UTF-8 وحفظ Excel 2007)</label><input type="file" accept=".csv" onchange="csvIn(this.files[0])"></div>
<div class="card"><button onclick="go('bc')">💬 رسالة جماعية واتساب</button></div>
<div class="card"><b>تغيير كلمة السر</b><input id="o1" type="password" placeholder="كلمة السر القديمة"><input id="o2" placeholder="الرقم الثابت"><input id="o3" placeholder="الكود السري"><input id="o4" type="password" placeholder="كلمة السر الجديدة"><button onclick="chg()">تغيير</button></div></div>`}
async function chg(){if(o1.value!==DB.pw||o2.value!==DB.code||o3.value.trim().toLowerCase()!==SECRET||!o4.value)return alert('البيانات غير صحيحة');DB.pw=o4.value;await save();alert('تم التغيير')}
const dl=(n,t,m)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()};
const bk=()=>dl('backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(DB),'application/json');
const rs=f=>{const r=new FileReader();r.onload=async()=>{try{const d=JSON.parse(r.result);if(!d.units)throw 0;if(confirm('استبدال كل البيانات بالنسخة؟')){DB=d;await save();go('home')}}catch(e){alert('ملف غير صالح')}};r.readAsText(f)};
const KS=FL.map(f=>f[0]);
function xlsOut(f){const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'),L=f?DB.units.filter(match):DB.units,hdr=[...FL.map(x=>x[1]),'الملاك','أرقام التواصل'];const rows=L.map(u=>[...KS.map(k=>u[k]),(u.owners||[]).map(o=>typeof o=='string'?o:o.n+(o.s?'|'+o.s:'')).join(' ; '),(u.phones||[]).join(' ; ')]);const html=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"></head><body><table border="1"><tr>${hdr.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></body></html>`;dl('units.xls','\ufeff'+html,'application/vnd.ms-excel;charset=utf-8')}
function csvOut(f){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',L=f?DB.units.filter(match):DB.units;dl('units.csv','\ufeff'+[[...FL.map(x=>x[1]),'الملاك','أرقام التواصل'].map(q).join(',')].concat(L.map(u=>[...KS.map(k=>u[k]),(u.owners||[]).map(o=>typeof o=='string'?o:o.n+(o.s?'|'+o.s:'')).join(' ; '),(u.phones||[]).join(' ; ')].map(q).join(','))).join('\r\n'),'text/csv;charset=utf-8')}
function pc(t){let r=[],w=[],c='',q=0;for(let i=0;i<t.length;i++){const x=t[i];if(q){if(x=='"'){if(t[i+1]=='"'){c+='"';i++}else q=0}else c+=x}else if(x=='"')q=1;else if(x==','){w.push(c);c=''}else if(x=='\n'){w.push(c);r.push(w);w=[];c=''}else if(x!='\r')c+=x}if(c||w.length){w.push(c);r.push(w)}return r}
function readCsvSmart(f,cb){const r=new FileReader();r.onload=()=>{let txt=r.result;if(txt.includes('\ufffd')){const r2=new FileReader();r2.onload=()=>cb(r2.result);r2.readAsText(f,'windows-1256')}else cb(txt)};r.readAsText(f,'utf-8')}
const csvIn=f=>{readCsvSmart(f,async raw=>{const R_=pc(raw.replace(/^\ufeff/,'')).slice(1);let n=0;R_.forEach((w,i)=>{if(!w[1])return;const u={id:Date.now()+i,upd:Date.now(),arch:[]};KS.forEach((k,j)=>u[k]=(w[j]||'').trim());u.owners=(w[KS.length]||'').split(';').map(x=>{const[n,h]=x.split('|');return{n:(n||'').trim(),s:(h||'').trim()}}).filter(o=>o.n);u.phones=(w[KS.length+1]||'').split(';').map(x=>x.trim()).filter(Boolean);const e=DB.units.find(x=>x.num==u.num);if(e){const s={...e};delete s.arch;delete s.img;DB.hist.push({uid:e.id,from:e.upd,until:Date.now(),why:'استيراد من ملف',s});Object.assign(e,u,{id:e.id,arch:e.arch,img:e.img})}else DB.units.push(u);n++});await save();alert('تم استيراد '+n+' وحدة');go('home')})};
/* ---------- broadcast ---------- */
function bc(){const P=[];DB.units.forEach(u=>(u.phones||[]).forEach(p=>P.push([title(u),p])));return`${bar('رسالة جماعية','admin')}<div class="w"><div class="card"><textarea id="bm" rows="4" placeholder="اكتب الرسالة..."></textarea><small>واتساب يفتح رقماً رقماً: اضغط على كل رقم لإرسال الرسالة له (${P.length} رقم)</small></div>${P.map(p=>`<div class="card"><b>${E(p[0])}</b> ${E(p[1])} <button class="k" onclick="wa('${p[1]}',bm.value);this.className='g'">إرسال</button></div>`).join('')}</div>`}
/* ---------- start ---------- */
(async()=>{DB=await load()||{pw:'',code:'',phone:'',units:[],hist:[]};const mo=x=>x.owners=(x.owners||[]).map(o=>typeof o=='string'?{n:o,s:''}:o);DB.units.forEach(mo);DB.hist.forEach(h=>mo(h.s));if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();R();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js')})();
</script></body></html>
